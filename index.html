<body>
  <div class="app-container" id="app-root">
    
    <!-- Barra Lateral de Navegación Curricular (7 RAs) -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Navegación curricular de los 7 Resultados de Aprendizaje">
      <!-- Generado dinámicamente por NavigationComponent -->
    </aside>

    <!-- Fondo oscurecido para navegación móvil -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Cabecera Superior Fija -->
    <header class="app-header" id="app-header">
      <div class="header-title-wrap">
        <button class="btn-mobile-nav" id="btn-mobile-nav" aria-label="Abrir menú curricular">
          ☰
        </button>
        <span class="header-badge-course hide-mobile">DAW 2º Curso · Módulo 0612</span>
        <div class="header-title">
          <span>Desarrollo Web en Entorno Cliente</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn-code-action" id="btn-reset-progress" title="Reiniciar datos de evaluación guardados">

        </button>
      </div>
    </header>

    <!-- Contenido Principal Dinámico -->
    <main class="app-main" id="main-content" role="main">
      <div class="content-container">
        
        <!-- Cabecera Hero y Tabs de Navegación -->
        <section id="view-header-container" aria-label="Información del Resultado de Aprendizaje y pestañas">

        </section>

        <!-- Zona de Vistas (Teoría / Quizzes / Retos / Roadmap) -->
        <section id="view-content-container" aria-label="Contenido didáctico interactivo">
          <!-- Renderizado dinámicamente por la vista activa -->
        </section>

      </div>
    </main>

  <!-- CodeMirror 5 Core & Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
