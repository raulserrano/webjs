<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crop Logo</title>
</head>
<body>
  <img id="srcImg" src="cifp_carlos3_logo.jpg" style="display:none;">
  <canvas id="c1" width="360" height="380"></canvas>
  <canvas id="c2" width="580" height="150"></canvas>
  <canvas id="c3" width="260" height="260"></canvas>
  <script>
    window.onload = () => {
      const img = document.getElementById('srcImg');
      
      // Canvas 1: Top logo with text (approx x: 120, y: 70, w: 360, h: 370)
      const ctx1 = document.getElementById('c1').getContext('2d');
      ctx1.drawImage(img, 118, 70, 360, 370, 0, 0, 360, 370);
      
      // Canvas 2: Bottom horizontal banner (approx x: 10, y: 670, w: 576, h: 140)
      const ctx2 = document.getElementById('c2').getContext('2d');
      ctx2.drawImage(img, 10, 670, 576, 140, 0, 0, 580, 150);

      // Canvas 3: Icon square only (approx x: 170, y: 70, w: 256, h: 256)
      const ctx3 = document.getElementById('c3').getContext('2d');
      ctx3.drawImage(img, 170, 75, 256, 256, 0, 0, 260, 260);

      const d1 = document.getElementById('c1').toDataURL('image/png');
      const d2 = document.getElementById('c2').toDataURL('image/png');
      const d3 = document.getElementById('c3').toDataURL('image/png');

      const res = document.createElement('div');
      res.id = 'output';
      res.dataset.logoTop = d1;
      res.dataset.logoBanner = d2;
      res.dataset.logoIcon = d3;
      document.body.appendChild(res);
      console.log('CROPS_DONE');
    };
  </script>
</body>
</html>
